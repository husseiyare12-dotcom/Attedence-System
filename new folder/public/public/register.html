<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account</title><link rel="stylesheet" href="/public.css"></head>
<body class="auth-page"><main class="auth-card"><p class="eyebrow">Student Attendance System</p><h1>Create account</h1><p>Register as a student or teacher.</p><form id="registerForm"><input type="text" id="name" placeholder="Full name" required><input type="email" id="email" placeholder="Email address" required><select id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select><input type="text" id="studentId" placeholder="Student ID (for student account)"><input type="password" id="password" placeholder="Password (8+ characters)" minlength="8" required><button type="submit">Register</button></form><p id="authMessage" class="form-message"></p><p>Already registered? <a href="/login.html">Sign in</a></p></main><script src="auth.js"></script></body></html>
