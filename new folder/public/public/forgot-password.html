<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Password reset</title><link rel="stylesheet" href="/public.css"></head>
<body class="auth-page"><main class="auth-card"><p class="eyebrow">Account recovery</p><h1>Reset password</h1><form id="resetRequestForm"><input type="email" id="resetEmail" placeholder="Account email" required><button type="submit">Request reset token</button></form><form id="resetConfirmForm"><input type="text" id="resetToken" placeholder="Reset token" required><input type="password" id="resetPassword" placeholder="New password (8+ characters)" minlength="8" required><button type="submit">Set new password</button></form><p id="authMessage" class="form-message"></p><p><a href="/login.html">Back to sign in</a></p></main><script src="/theme.js"></script><script src="auth.js"></script></body></html>
