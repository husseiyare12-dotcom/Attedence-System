<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Examinations</title><link rel="stylesheet" href="/public.css"></head>
<body><aside class="sidebar"><h2>Attendance</h2><a href="/">Dashboard</a><a href="/student.html">Students</a><a href="/attendance.html">Attendance</a><a href="/exams.html" class="active-link">Examinations</a></aside><main><header><div><p class="eyebrow">Teacher workspace</p><h1>Examinations</h1><p>Create exams, enter marks, and update student results.</p></div><a class="back-link" href="/">Back to dashboard</a></header><section class="panel"><h2>Create examination</h2><form id="examForm"><input id="title" placeholder="Exam title" required><input id="subject" placeholder="Subject" required><input id="date" type="date" required><input id="maximumMarks" type="number" min="1" placeholder="Maximum marks" required><button type="submit">Create examination</button></form><p id="examMessage" class="form-message"></p></section><section class="panel"><h2>Enter student result</h2><form id="resultForm"><select id="resultStudent" required><option value="">Select student</option></select><input id="resultExam" placeholder="Exam name" required><input id="resultSubject" placeholder="Subject" required><input id="resultMarks" type="number" min="0" placeholder="Marks" required><input id="resultMaximumMarks" type="number" min="1" placeholder="Maximum marks" required><button type="submit">Save result</button></form><p id="resultMessage" class="form-message"></p></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>Exam</th><th>Subject</th><th>Date</th><th>Maximum marks</th></tr></thead><tbody id="examTable"></tbody></table></div></section></main><script src="/theme.js"></script><script src="exams.js"></script></body></html>
